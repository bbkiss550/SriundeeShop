<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
	<head th:replace="common/header :: header_head"></head>
	
	<script th:src="@{/script/order/order.js}"></script>
	
	<style>
		.card-move {
			border: none;
			box-shadow: 0 4px 6px rgba(0,0,0,0.05);
			transition: transform 0.2s;
		}
	  
		.card-move:hover {
			transform: translateY(-5px);
			cursor: pointer;
		}
	
		.card-title {
			font-size: 1rem;
			margin-bottom: 15px;
			display: -webkit-box;
			-webkit-line-clamp: 2;
			-webkit-box-orient: vertical;
			overflow: hidden;
		}
	  
		.btn-cart-floating {
		    position: fixed;
		    bottom: 30px;
		    right: 30px;
		    z-index: 1000;
		    
		    width: 80px;
		    height: 80px;
		    border-radius: 50%;
		    
		    display: flex;
		    align-items: center;
		    justify-content: center;
		    font-size: 32px;
		    
		    background-color: #28a745;
		    color: white;
		    border: none;
		    box-shadow: 0 6px 15px rgba(0,0,0,0.4);
		    cursor: pointer;
		    transition: all 0.3s ease;
		}
		
		.cart-badge {
		    position: absolute;
		    top: 10px;
		    right: 10px;
		    background-color: #ffc107;
		    color: #000;
		    border-radius: 50%;
		    padding: 5px 10px;
		    font-size: 16px;
		    font-weight: bold;
		    min-width: 25px;
		    height: 25px;
		    display: flex;
		    align-items: center;
		    justify-content: center;
		    border: 2px solid white;
		}
		
		.btn-cart-floating:hover {
		    transform: scale(1.1);
		    background-color: #218838;
		}
	</style>
	
	<body>
	    <div id="app">
	        <div th:replace="common/menu :: menu"></div>
	        <div id="main">
	            <header th:replace="common/header :: header_nav"></header>
	            <div class="page-heading">
	                <h3>บันทึกออร์เดอร์</h3>
	            </div>
				<div class="page-content">
	                <section class="row">
	                    <div class="col-12">
	                        <div class="row" style="display:none;">
	                            <div class="col-12">
									<div class="card">
				                        <div class="card-body">
				                            <table class="table table-striped" id="table1">
				                                <thead>
				                                    <tr>
														<th class="fix_width"></th>
														<th class="fix_width">#</th>
														<th class="logo_width"></th>
				                                        <th class="auto_width">ชื่อ</th>
														<th class="status_width">ประเภท</th>
														<th class="auto_width">ศิลปิน</th>
														<th class="status_width">ปิดรับ</th>
														<th class="status_width">กำหนดส่ง</th>
														<th class="status_width">ชำระงวดที่สอง</th>
														<th class="status_width">เก็บยอดที่เหลือ</th>
				                                    </tr>
				                                </thead>
				                                <tbody th:utext="${mainProduct}"></tbody>
				                            </table>
				                        </div>
				                    </div>
	                            </div>
	                        </div>
							<div th:utext="${mainProduct_card}"></div>
							<div th:include="./order/modal-order"></div>
	                    </div>
	                </section>
	            </div>
	            <footer th:replace="common/footer :: footer"></footer>
	        </div>
	    </div>
		<button type="button" class="btn-cart-floating" onclick="checkout()">
		    <i class="fas fa-shopping-cart"></i>
		    <span id="cart-count" class="cart-badge">0</span>
		</button>
	</body>
</html>
