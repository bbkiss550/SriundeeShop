<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="common/header :: header_head"></head>

<style>
	.order-list-row:hover > td {
		background-color: #f1f5ff !important;
	}

	.order-list-row {
		cursor: pointer;
	}

	.order-code-col {
		width: 150px;
		min-width: 150px;
		padding-left: 1.25rem !important;
		padding-right: 1rem !important;
		white-space: nowrap;
	}

	.order-date-col {
		width: 130px;
		min-width: 130px;
		padding-left: 1.25rem !important;
		padding-right: 1rem !important;
		white-space: nowrap;
	}

	.order-money-col {
		width: 130px;
		min-width: 130px;
		white-space: nowrap;
	}

	.order-list-badge {
		display: inline-flex;
		align-items: center;
		justify-content: center;
		min-width: 92px;
		min-height: 30px;
		white-space: normal;
		line-height: 1.2;
	}

	.order-status-list {
		display: flex;
		flex-wrap: wrap;
		gap: 0.35rem;
	}

	.order-detail-modal-dialog {
		max-width: calc(100vw - 48px);
		width: calc(100vw - 48px);
	}
</style>

<body>
    <div id="app">
        <div th:replace="common/menu :: menu"></div>
        <div id="main">
            <header th:replace="common/header :: header_nav"></header>

            <div class="page-heading">
                <h3>รายการสั่งซื้อ</h3>
            </div>

			<div class="page-content">
				<section class="row">
					<div class="col-12">
						<div class="card">
							<div class="card-body">
								<form class="row g-3 align-items-end" id="orderListFilterForm" method="get" th:action="@{/orders}">
									<div class="col-md-3">
										<label for="orderDate" class="form-label">วันที่สั่งซื้อ</label>
										<input type="date" id="orderDate" name="orderDate" class="form-control" th:value="${orderDate}">
									</div>
									<div class="col-md-3">
										<label for="customerName" class="form-label">ชื่อลูกค้า</label>
										<input type="text" id="customerName" name="customerName" class="form-control" th:value="${customerName}" placeholder="ค้นหาชื่อลูกค้า">
									</div>
									<div class="col-md-2">
										<label for="payMethod" class="form-label">สถานะชำระเงิน</label>
										<select id="payMethod" name="payMethod" class="form-select" th:utext="${paymentMethodList}"></select>
									</div>
									<div class="col-md-2">
										<label for="orderStatus" class="form-label">สถานะสั่งซื้อ</label>
										<select id="orderStatus" name="orderStatus" class="form-select" th:utext="${orderStatusList}"></select>
									</div>
									<div class="col-md-2">
										<button type="submit" class="btn btn-primary">
											<i data-feather="search"></i> ค้นหา
										</button>
										<button type="button" class="btn btn-light-secondary" onclick="clear_order_list_filter()">ล้างค่า</button>
									</div>
								</form>
							</div>
						</div>
					</div>
				</section>

                <section class="row">
                    <div class="col-12">
						<div class="card">
	                        <div class="card-body">
	                            <table class="table table-striped" id="table1">
	                                <thead>
	                                    <tr>
	                                        <th class="order-code-col">เลขที่คำสั่งซื้อ</th>
	                                        <th class="order-date-col">วันที่สั่งซื้อ</th>
	                                        <th class="auto_width">ชื่อลูกค้า</th>
	                                        <th class="order-money-col text-end">ราคาเต็ม</th>
	                                        <th class="order-money-col text-end">มัดจำ</th>
	                                        <th class="order-money-col text-end">ยอดเหลือ</th>
	                                        <th class="order-money-col text-end">ค่าส่ง</th>
	                                        <th class="order-money-col text-end">สุทธิ</th>
	                                        <th class="status_width">ชำระเงิน</th>
	                                        <th class="auto_width">สถานะสั่งซื้อ</th>
	                                    </tr>
	                                </thead>
	                                <tbody id="orderListRows" th:utext="${orderRows}"></tbody>
	                            </table>
	                        </div>
	                    </div>
                    </div>
                </section>
            </div>

			<div class="modal fade text-left" id="orderDetailModal" tabindex="-1" role="dialog" aria-hidden="true">
				<div class="modal-dialog modal-xl modal-dialog-scrollable order-detail-modal-dialog" role="document">
					<div class="modal-content">
						<div class="modal-header bg-primary">
							<h5 class="modal-title text-white">รายละเอียดสินค้า</h5>
							<button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
								<i data-feather="x"></i>
							</button>
						</div>
						<div class="modal-body">
							<div class="table-responsive">
								<table class="table">
									<thead>
										<tr>
											<th>#</th>
											<th>ลูกค้า</th>
											<th>ศิลปิน</th>
											<th>สินค้า</th>
											<th>เว็บ</th>
											<th>เวอร์ชั่น</th>
											<th>ปก</th>
											<th class="text-end">จำนวน</th>
											<th class="text-end">ราคาเต็ม รวม</th>
											<th class="text-end">ราคามัดจำ รวม</th>
											<th class="text-end">ยอดคงเหลือ</th>
											<th>สถานะส่งของ</th>
										</tr>
									</thead>
									<tbody id="orderDetailRows"></tbody>
								</table>
							</div>
						</div>
						<div class="modal-footer">
							<button type="button" class="btn btn-danger" data-bs-dismiss="modal">ปิด</button>
						</div>
					</div>
				</div>
			</div>

            <footer th:replace="common/footer :: footer"></footer>
        </div>
    </div>
	<script th:src="@{/script/order/list.js}"></script>
</body>
</html>
