<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="common/header :: header_head"></head>

<style>
	.order-list-row:hover > td {
		background-color: #f1f5ff !important;
	}

	.order-list-row {
		cursor: pointer;
	}

	.order-code-col {
		width: 150px;
		min-width: 150px;
		padding-left: 1.25rem !important;
		padding-right: 1rem !important;
		white-space: nowrap;
	}

	.order-date-col {
		width: 130px;
		min-width: 130px;
		padding-left: 1.25rem !important;
		padding-right: 1rem !important;
		white-space: nowrap;
	}

	.order-money-col {
		width: 130px;
		min-width: 130px;
		white-space: nowrap;
	}

	.order-payment-col {
		width: 150px;
		min-width: 150px;
		white-space: nowrap;
	}

	.order-list-badge {
		display: inline-flex;
		align-items: center;
		justify-content: center;
		min-width: 118px;
		min-height: 30px;
		white-space: nowrap;
		line-height: 1.2;
	}

	.order-status-list .order-list-badge {
		min-width: 92px;
	}

	.order-status-list {
		display: flex;
		flex-wrap: wrap;
		gap: 0.35rem;
	}

	.order-detail-modal-dialog {
		max-width: calc(100vw - 48px);
		width: calc(100vw - 48px);
	}

	.order-detail-modal-dialog .modal-content {
		height: calc(100vh - 32px);
	}

	.order-receipt-modal-dialog {
		max-width: 960px;
	}

	.receipt-preview-wrap {
		background: #f8fafc;
		padding: 1rem;
		overflow: auto;
	}

	.receipt-preview-wrap .receipt {
		max-width: 880px;
		margin: 0 auto;
		padding: 28px;
		color: #111827;
		background: #ffffff;
		border: 1px solid #e5e7eb;
		font-family: Arial, Tahoma, sans-serif;
	}

	.receipt-preview-wrap .header {
		display: flex;
		justify-content: space-between;
		gap: 24px;
		padding-bottom: 18px;
		margin-bottom: 20px;
		border-bottom: 2px solid #111827;
	}

	.receipt-preview-wrap .receipt-logo {
		display: block;
		width: 132px;
		height: auto;
		margin: 0;
		object-fit: contain;
	}

	.receipt-preview-wrap .receipt-brand {
		display: flex;
		align-items: center;
		gap: 16px;
		min-width: 0;
	}

	.receipt-preview-wrap .receipt-title {
		min-width: 0;
	}

	.receipt-preview-wrap .receipt h1,
	html[data-theme="dark"] .receipt-preview-wrap .receipt h1 {
		margin: 0;
		color: #111827 !important;
		font-size: 28px;
	}

	.receipt-preview-wrap .shop {
		margin-top: 6px;
		font-size: 18px;
		font-weight: 700;
	}

	.receipt-preview-wrap .meta {
		text-align: right;
		line-height: 1.7;
	}

	.receipt-preview-wrap .info {
		display: grid;
		grid-template-columns: 1fr 1fr;
		gap: 12px 24px;
		margin-bottom: 18px;
		line-height: 1.6;
	}

	.receipt-preview-wrap .info > div {
		text-align: left;
	}

	.receipt-preview-wrap table {
		width: 100%;
		margin-top: 12px;
		border-collapse: collapse;
	}

	.receipt-preview-wrap th,
	.receipt-preview-wrap td {
		padding: 10px 8px;
		color: #111827 !important;
		vertical-align: top;
		border-bottom: 1px solid #e5e7eb;
	}

	.receipt-preview-wrap th {
		text-align: left;
		background: #f1f5f9;
	}

	.receipt-preview-wrap .right {
		text-align: right;
		white-space: nowrap;
	}

	.receipt-preview-wrap .product-cell {
		text-align: left;
	}

	.receipt-preview-wrap .muted {
		margin-top: 4px;
		color: #64748b;
		font-size: 12px;
	}

	.receipt-preview-wrap .summary {
		width: 340px;
		margin-top: 18px;
		margin-left: auto;
	}

	.receipt-preview-wrap .summary-row {
		display: grid;
		grid-template-columns: 1fr 140px;
		padding: 8px 0;
		border-bottom: 1px solid #e5e7eb;
	}

	.receipt-preview-wrap .summary-row span:first-child {
		text-align: left;
		padding-right: 0;
	}

	.receipt-preview-wrap .summary-row.total {
		font-size: 20px;
		font-weight: 800;
		border-bottom: 2px solid #111827;
	}
</style>

<body>
    <div id="app">
        <div th:replace="common/menu :: menu"></div>
        <div id="main">
            <header th:replace="common/header :: header_nav"></header>

            <div class="page-heading">
                <h3>รายการสั่งซื้อ</h3>
            </div>

			<div class="page-content">
				<section class="row">
					<div class="col-12">
						<div class="card">
							<div class="card-body">
								<form class="row g-3 align-items-end" id="orderListFilterForm" method="get" th:action="@{/orders}">
									<div class="col-md-2">
										<label for="startDate" class="form-label">วันที่เริ่มต้น</label>
										<input type="date" id="startDate" name="startDate" class="form-control" th:value="${startDate}">
									</div>
									<div class="col-md-2">
										<label for="endDate" class="form-label">วันที่สิ้นสุด</label>
										<input type="date" id="endDate" name="endDate" class="form-control" th:value="${endDate}">
									</div>
									<div class="col-md-3">
										<label for="customerName" class="form-label">ชื่อลูกค้า</label>
										<input type="text" id="customerName" name="customerName" class="form-control" th:value="${customerName}" placeholder="ค้นหาชื่อลูกค้า">
									</div>
									<div class="col-md-1">
										<label for="payMethod" class="form-label">สถานะชำระเงิน</label>
										<select id="payMethod" name="payMethod" class="form-select" th:utext="${paymentMethodList}"></select>
									</div>
									<div class="col-md-2">
										<label for="orderStatus" class="form-label">สถานะสั่งซื้อ</label>
										<select id="orderStatus" name="orderStatus" class="form-select" th:utext="${orderStatusList}"></select>
									</div>
									<div class="col-md-2">
										<button type="submit" class="btn btn-primary">
											<i data-feather="search"></i> ค้นหา
										</button>
										<button type="button" class="btn btn-light-secondary" onclick="clear_order_list_filter()">ล้างค่า</button>
									</div>
								</form>
							</div>
						</div>
					</div>
				</section>

                <section class="row">
                    <div class="col-12">
						<div class="card">
	                        <div class="card-body">
	                            <table class="table table-striped" id="table1">
	                                <thead>
	                                    <tr>
	                                        <th class="order-code-col">เลขที่คำสั่งซื้อ</th>
	                                        <th class="order-date-col">วันที่สั่งซื้อ</th>
	                                        <th class="auto_width">ชื่อลูกค้า</th>
	                                        <th class="order-money-col text-end">ราคาเต็ม</th>
	                                        <th class="order-money-col text-end">มัดจำ</th>
	                                        <th class="order-money-col text-end">ยอดเหลือ</th>
	                                        <th class="order-money-col text-end">ค่าส่ง</th>
	                                        <th class="order-money-col text-end">สุทธิ</th>
	                                        <th class="order-payment-col">ชำระเงิน</th>
	                                        <th class="auto_width">สถานะสั่งซื้อ</th>
	                                    </tr>
	                                </thead>
	                                <tbody id="orderListRows" th:utext="${orderRows}"></tbody>
	                            </table>
	                        </div>
	                    </div>
                    </div>
                </section>
            </div>

			<div class="modal fade text-left" id="orderDetailModal" tabindex="-1" role="dialog" aria-hidden="true">
				<div class="modal-dialog modal-xl modal-dialog-scrollable order-detail-modal-dialog" role="document">
					<div class="modal-content">
						<div class="modal-header bg-primary">
							<h5 class="modal-title text-white">รายละเอียดสินค้า</h5>
							<button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
								<i data-feather="x"></i>
							</button>
						</div>
						<div class="modal-body">
							<div class="table-responsive">
								<table class="table">
									<thead>
										<tr>
											<th>#</th>
											<th>ลูกค้า</th>
											<th>ศิลปิน</th>
											<th>สินค้า</th>
											<th>เว็บ</th>
											<th>เวอร์ชั่น</th>
											<th>ปก</th>
											<th class="text-end">จำนวน</th>
											<th class="text-end">ราคาเต็ม/ชิ้น</th>
											<th class="text-end">มัดจำ/ชิ้น</th>
											<th class="text-end">ราคาเต็ม รวม</th>
											<th class="text-end">ราคามัดจำ รวม</th>
											<th class="text-end">ยอดคงเหลือ</th>
											<th>สถานะส่งของ</th>
										</tr>
									</thead>
									<tbody id="orderDetailRows"></tbody>
								</table>
							</div>
						</div>
						<div class="modal-footer">
							<button type="button" class="btn btn-success" id="btnCreateReceipt" onclick="create_order_receipt()">
								<i data-feather="file-text"></i> สร้างใบเสร็จ
							</button>
							<button type="button" class="btn btn-danger" data-bs-dismiss="modal">ปิด</button>
						</div>
					</div>
				</div>
			</div>

			<div class="modal fade text-left" id="orderReceiptModal" tabindex="-1" role="dialog" aria-hidden="true">
				<div class="modal-dialog modal-lg modal-dialog-scrollable order-receipt-modal-dialog" role="document">
					<div class="modal-content">
						<div class="modal-header bg-success">
							<h5 class="modal-title text-white">ใบเสร็จ</h5>
							<button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
								<i data-feather="x"></i>
							</button>
						</div>
						<div class="modal-body receipt-preview-wrap">
							<div id="orderReceiptPreview" class="text-center text-muted">กำลังโหลด...</div>
						</div>
						<div class="modal-footer">
							<button type="button" class="btn btn-primary" onclick="copy_order_receipt_image()">
								<i data-feather="copy"></i> Copy image
							</button>
							<button type="button" class="btn btn-danger" data-bs-dismiss="modal">ปิด</button>
						</div>
					</div>
				</div>
			</div>

            <footer th:replace="common/footer :: footer"></footer>
        </div>
    </div>
	<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
	<script th:src="@{/script/order/list.js}"></script>
</body>
</html>
