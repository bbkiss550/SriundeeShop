<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="common/header :: header_head"></head>

<style>
	.deposit-balance-row {
		cursor: pointer;
	}

	.deposit-balance-row:hover > td {
		background-color: #f1f5ff !important;
	}

	.deposit-action-col {
		width: 116px;
		min-width: 116px;
		white-space: nowrap;
	}

	.deposit-code-col {
		width: 150px;
		min-width: 150px;
		padding-left: 1.25rem !important;
		padding-right: 1rem !important;
		white-space: nowrap;
	}

	.deposit-date-col {
		width: 130px;
		min-width: 130px;
		white-space: nowrap;
	}

	.deposit-money-col {
		width: 140px;
		min-width: 140px;
		white-space: nowrap;
	}

	.deposit-payment-badge {
		display: inline-flex;
		align-items: center;
		justify-content: center;
		min-width: 92px;
		min-height: 30px;
		white-space: normal;
		line-height: 1.2;
	}

	.deposit-detail-modal-dialog {
		max-width: calc(100vw - 48px);
		width: calc(100vw - 48px);
	}

	.deposit-detail-modal-dialog .modal-content {
		height: calc(100vh - 32px);
	}
</style>

<body>
    <div id="app">
        <div th:replace="common/menu :: menu"></div>
        <div id="main">
            <header th:replace="common/header :: header_nav"></header>

            <div class="page-heading">
                <h3>บันทึกรับเงินมัดจำที่เหลือ</h3>
            </div>

			<div class="page-content">
				<section class="row">
					<div class="col-12">
						<div class="card">
							<div class="card-body">
								<form class="row g-3 align-items-end" id="depositBalanceFilterForm" method="get" th:action="@{/deposit-balance}">
									<div class="col-md-3">
										<div class="input-group">
											<label for="startDate" class="input-group-text">วันที่เริ่มต้น</label>
											<input type="date" id="startDate" name="startDate" class="form-control" th:value="${startDate}">
										</div>
									</div>
									<div class="col-md-3">
										<div class="input-group">
											<label for="endDate" class="input-group-text">ถึง</label>
											<input type="date" id="endDate" name="endDate" class="form-control" th:value="${endDate}">
										</div>
									</div>
									<div class="col-md-3">
										<div class="input-group">
											<label for="customerName" class="input-group-text">ชื่อลูกค้า</label>
											<input type="text" id="customerName" name="customerName" class="form-control" th:value="${customerName}" placeholder="ค้นหาชื่อลูกค้า">
										</div>
									</div>
									<div class="col-md-3">
										<button type="submit" class="btn btn-primary">
											<i data-feather="search"></i> ค้นหา
										</button>
										<button type="button" class="btn btn-light-secondary" onclick="clear_deposit_balance_filter()">ล้างค่า</button>
									</div>
								</form>
							</div>
						</div>
					</div>
				</section>

                <section class="row">
                    <div class="col-12">
						<div class="card">
	                        <div class="card-body">
	                            <table class="table table-striped" id="table1">
	                                <thead>
	                                    <tr>
	                                        <th class="deposit-action-col">รับเงิน</th>
	                                        <th class="deposit-code-col">เลขที่คำสั่งซื้อ</th>
	                                        <th class="deposit-date-col">วันที่สั่งซื้อ</th>
	                                        <th class="auto_width">ชื่อลูกค้า</th>
	                                        <th class="deposit-money-col text-end">ราคาเต็ม</th>
	                                        <th class="deposit-money-col text-end">มัดจำ</th>
	                                        <th class="deposit-money-col text-end">ยอดที่เหลือ</th>
	                                        <th class="status_width">ชำระเงิน</th>
	                                    </tr>
	                                </thead>
	                                <tbody id="depositBalanceRows" th:utext="${depositRows}"></tbody>
	                            </table>
	                        </div>
	                    </div>
                    </div>
                </section>
            </div>

			<div class="modal fade text-left" id="depositDetailModal" tabindex="-1" role="dialog" aria-hidden="true">
				<div class="modal-dialog modal-xl modal-dialog-scrollable deposit-detail-modal-dialog" role="document">
					<div class="modal-content">
						<div class="modal-header bg-primary">
							<h5 class="modal-title text-white">รายละเอียดสินค้า</h5>
							<button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
								<i data-feather="x"></i>
							</button>
						</div>
						<div class="modal-body">
							<div class="table-responsive">
								<table class="table">
									<thead>
										<tr>
											<th>#</th>
											<th>ลูกค้า</th>
											<th>ศิลปิน</th>
											<th>สินค้า</th>
											<th>เว็บ</th>
											<th>เวอร์ชั่น</th>
											<th>ปก</th>
											<th class="text-end">จำนวน</th>
											<th class="text-end">ราคาเต็ม/ชิ้น</th>
											<th class="text-end">มัดจำ/ชิ้น</th>
											<th class="text-end">ราคาเต็ม รวม</th>
											<th class="text-end">ราคามัดจำ รวม</th>
											<th class="text-end">ยอดคงเหลือ</th>
											<th>ชำระ</th>
										</tr>
									</thead>
									<tbody id="depositDetailRows"></tbody>
								</table>
							</div>
						</div>
						<div class="modal-footer detail-modal-footer">
							<div id="depositDetailSummary" class="detail-summary-footer"></div>
							<div class="detail-modal-actions">
								<button type="button" class="btn btn-danger" data-bs-dismiss="modal">ปิด</button>
							</div>
						</div>
					</div>
				</div>
			</div>

            <footer th:replace="common/footer :: footer"></footer>
        </div>
    </div>
	<script th:src="@{/script/deposit/balance.js}"></script>
</body>
</html>
