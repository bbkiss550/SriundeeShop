<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head th:replace="common/header :: header_head"></head>
<style>
    .login-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        background: #f2f7ff;
    }

    .login-box {
        width: min(420px, 100%);
        padding: 2rem;
        border: 1px solid #dce7f1;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 16px 45px rgba(15, 23, 42, 0.12);
    }

    .login-logo {
        display: flex;
        justify-content: center;
        margin-bottom: 1.5rem;
    }

    .login-logo img {
        max-width: 190px;
        height: auto;
    }

    html[data-theme="dark"] .login-page {
        background: #111827;
    }

    html[data-theme="dark"] .login-box {
        color: #ffffff;
        border-color: #334155;
        background: #1f2937;
    }
</style>
<body>
    <main class="login-page">
        <section class="login-box">
            <div class="login-logo">
                <img th:src="@{/mazer/dist/assets/images/logo/new%20logo.png}" alt="Sriundee Shop">
            </div>
            <h3 class="text-center mb-4">เข้าสู่ระบบ</h3>
            <form th:action="@{/login}" method="post">
                <div class="input-group mb-3">
                    <span class="input-group-text">Username</span>
                    <input type="text" class="form-control" name="username" th:value="${username}" autofocus autocomplete="username">
                </div>
                <div class="alert alert-danger py-2" th:if="${error}" th:text="${error}"></div>
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-box-arrow-in-right"></i> เข้าสู่ระบบ
                </button>
            </form>
        </section>
    </main>
</body>
</html>
