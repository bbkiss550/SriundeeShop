<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<footer th:fragment="footer" class="app-shell-footer">
    <div class="app-version-footer">
        <button type="button" class="app-version-link" id="deployDetailButton">
            <span>Version</span>
            <span>1.0.5</span>
            <span>2026-06-03</span>
        </button>
    </div>
    <div th:if="${appUsername != null and !#strings.isEmpty(appUsername)}" class="app-footer-user">
        <span>User : <span th:text="${appUsername}"></span></span>
        <span th:if="${appLoginDate != null and !#strings.isEmpty(appLoginDate)}">Login Date : <span th:text="${appLoginDate}"></span></span>
        <a th:href="@{/logout}" class="btn app-footer-logout-btn" title="Log out">
            <i class="bi bi-box-arrow-right"></i>
            <span>Log out</span>
        </a>
    </div>
    <div class="modal fade" id="deployDetailModal" tabindex="-1" aria-labelledby="deployDetailModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header bg-primary">
                    <h5 class="modal-title text-white" id="deployDetailModalTitle">Deploy Detail</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="accordion deploy-detail-accordion" id="deployDetailAccordion">
                        <div th:if="${appLogVersions == null or appLogVersions.isEmpty()}" class="deploy-detail-empty">ไม่มีรายละเอียด deploy detail</div>
                        <div class="accordion-item" th:each="logVersion, iter : ${appLogVersions}">
                            <h2 class="accordion-header" th:id="${'deployDetailHeading' + logVersion.id}">
                                <button class="accordion-button deploy-detail-toggle" th:classappend="${iter.first} ? '' : 'collapsed'" type="button" data-bs-toggle="collapse" th:attr="data-bs-target=${'#deployDetailCollapse' + logVersion.id},aria-expanded=${iter.first},aria-controls=${'deployDetailCollapse' + logVersion.id}">
                                    <span class="deploy-detail-title">
                                        <span th:if="${iter.first}" class="deploy-detail-kicker">Current Deploy</span>
                                        <span class="deploy-detail-version" th:text="${'Version ' + logVersion.version}">Version</span>
                                    </span>
                                    <span class="deploy-detail-date" th:text="${logVersion.date}">Date</span>
                                </button>
                            </h2>
                            <div th:id="${'deployDetailCollapse' + logVersion.id}" class="accordion-collapse collapse" th:classappend="${iter.first} ? 'show deploy-detail-latest' : ''" th:attr="aria-labelledby=${'deployDetailHeading' + logVersion.id}" data-bs-parent="#deployDetailAccordion">
                                <div class="accordion-body">
                                    <ul th:if="${!appLogVersionDescriptionItems[logVersion.id].isEmpty()}" class="deploy-detail-list mb-0">
                                        <li th:each="item : ${appLogVersionDescriptionItems[logVersion.id]}" th:text="${item}"></li>
                                    </ul>
                                    <div th:if="${appLogVersionDescriptionItems[logVersion.id].isEmpty()}" class="deploy-detail-empty">ไม่มีรายละเอียด deploy detail ใน version เดิม</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">ปิด</button>
                </div>
            </div>
        </div>
    </div>
    <script th:src="@{/mazer/dist/assets/vendors/perfect-scrollbar/perfect-scrollbar.min.js}"></script>
    <script th:src="@{/mazer/dist/assets/js/bootstrap.bundle.min.js}"></script>
    <script>
        (function() {
            const deployDetailModal = document.getElementById("deployDetailModal");
            const deployDetailButton = document.getElementById("deployDetailButton");
            if (!deployDetailModal || !deployDetailButton || !window.bootstrap) {
                return;
            }

            if (deployDetailModal.parentElement !== document.body) {
                document.body.appendChild(deployDetailModal);
            }

            deployDetailButton.addEventListener("click", function() {
                const latestDeployDetail = deployDetailModal.querySelector(".deploy-detail-latest");
                if (latestDeployDetail && window.bootstrap.Collapse) {
                    deployDetailModal.querySelectorAll(".accordion-collapse.show").forEach(function(openCollapse) {
                        if (openCollapse !== latestDeployDetail) {
                            const collapse = bootstrap.Collapse.getOrCreateInstance
                                ? bootstrap.Collapse.getOrCreateInstance(openCollapse, { toggle: false })
                                : new bootstrap.Collapse(openCollapse, { toggle: false });
                            collapse.hide();
                        }
                    });
                    const latestCollapse = bootstrap.Collapse.getOrCreateInstance
                        ? bootstrap.Collapse.getOrCreateInstance(latestDeployDetail, { toggle: false })
                        : new bootstrap.Collapse(latestDeployDetail, { toggle: false });
                    latestCollapse.show();
                }
                const modal = bootstrap.Modal.getOrCreateInstance
                    ? bootstrap.Modal.getOrCreateInstance(deployDetailModal)
                    : new bootstrap.Modal(deployDetailModal);
                modal.show();
            });

            deployDetailModal.querySelectorAll(".accordion-collapse").forEach(function(collapseElement) {
                collapseElement.addEventListener("show.bs.collapse", function() {
                    deployDetailModal.querySelectorAll(".accordion-collapse.show").forEach(function(openCollapse) {
                        if (openCollapse !== collapseElement) {
                            const collapse = bootstrap.Collapse.getOrCreateInstance
                                ? bootstrap.Collapse.getOrCreateInstance(openCollapse, { toggle: false })
                                : new bootstrap.Collapse(openCollapse, { toggle: false });
                            collapse.hide();
                        }
                    });
                });
            });
        })();
    </script>
	<script th:src="@{/mazer/dist/assets/vendors/simple-datatables/simple-datatables.js}"></script>
	<script th:src="@{/mazer/dist/assets/vendors/fontawesome/all.min.js}"></script>
    <script th:src="@{/mazer/dist/assets/js/extensions/sweetalert2.js}"></script>
    <script th:src="@{/mazer/dist/assets/vendors/sweetalert2/sweetalert2.all.min.js}"></script>
	<script th:src="@{/mazer/dist/assets/vendors/choices.js/choices.min.js}"></script>
    <script th:src="@{/mazer/dist/assets/js/main.js}"></script>
    <script th:src="@{/script/date-display.js}"></script>
    <script th:src="@{/script/theme.js}"></script>
    <script th:src="@{/script/menu-order.js}"></script>
    <script th:src="@{/script/submit-guard.js}"></script>
    <script>
        (function() {
            const navigation = document.querySelector(".top-navigation");
            const footer = document.querySelector(".app-shell-footer");
            const main = document.getElementById("main");
            if (!navigation || !footer || !main) {
                return;
            }

            const updateShellSize = function() {
                document.documentElement.style.setProperty("--app-shell-header-height", navigation.offsetHeight + "px");
                document.documentElement.style.setProperty("--app-shell-footer-height", footer.offsetHeight + "px");
                document.documentElement.style.setProperty("--app-shell-scrollbar-width", Math.max(0, main.offsetWidth - main.clientWidth) + "px");
            };

            updateShellSize();
            window.addEventListener("resize", updateShellSize);
            if (window.ResizeObserver) {
                const shellSizeObserver = new ResizeObserver(updateShellSize);
                shellSizeObserver.observe(navigation);
                shellSizeObserver.observe(footer);
                shellSizeObserver.observe(main);
            }
        })();
    </script>
    <script>
        window.moveDetailSummaryToFooter = function(rowsId, summaryId) {
            const rows = document.getElementById(rowsId);
            const summary = document.getElementById(summaryId);
            if (!rows || !summary) {
                return;
            }

            summary.replaceChildren();
            const summaryCell = rows.querySelector(".detail-summary-cell");
            if (!summaryCell) {
                return;
            }

            const summaryGrid = summaryCell.querySelector(".detail-summary-grid");
            if (summaryGrid) {
                summary.appendChild(summaryGrid);
            }
            const summaryRow = summaryCell.closest("tr");
            if (summaryRow) {
                summaryRow.remove();
            }
        };
    </script>
	<script>
	    const refreshDataTableIcons = function() {
	        if (window.feather) {
	            feather.replace();
	        }
	    };

	    let table1 = document.querySelector('.table:not([data-datatable-managed])');
	    if (table1) {
	        const defaultDataTable = new simpleDatatables.DataTable(table1, {
	            fixedColumns: false,
	            perPage: 50,
	            perPageSelect: [50, 100, 150, 200]
	        });

	        defaultDataTable.on("datatable.sort", refreshDataTableIcons);
	        defaultDataTable.on("datatable.update", refreshDataTableIcons);
	        defaultDataTable.on("datatable.page", refreshDataTableIcons);
	        defaultDataTable.on("datatable.search", refreshDataTableIcons);
	    }
	</script>
</footer>
</html>
