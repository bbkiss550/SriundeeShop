<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
	<head th:replace="common/header :: header_head"></head>
	
	<style>
	    .btn-outline-purple {
	        color: #6f42c1 !important;
	        border-color: #6f42c1 !important;
	    }
		
	    .btn-outline-purple:hover {
	        background-color: #6f42c1 !important;
	        color: white !important;
	    }

		.bg-purple {
			background-color: #6f42c1 !important;
			color: white !important;
		}

		.order-status-badge {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			width: 150px;
			min-height: 36px;
			padding: 8px 10px;
			font-size: 0.85rem;
			white-space: normal;
			line-height: 1.2;
		}

	    .btn-status-grid {
	        font-size: 1rem !important;
	        padding: 8px 2px !important;
	        height: 100%;
	        display: flex;
	        align-items: center;
	        justify-content: center;
	        line-height: 1.2;
	        min-height: 52px;
	        border-width: 1.5px;
	    }

		.btn-change-floating {
		    position: fixed;
		    bottom: 30px;
		    right: 30px;
		    z-index: 1000;
		    width: 80px;
		    height: 80px;
		    border-radius: 50%;
		    display: none;
		    align-items: center;
		    justify-content: center;
		    font-size: 32px;
		    background-color: #435ebe;
		    color: white;
		    border: none;
		    box-shadow: 0 6px 15px rgba(0,0,0,0.4);
		    cursor: pointer;
		    transition: all 0.3s ease;
		}

		.btn-change-floating:hover {
		    transform: scale(1.1);
		    background-color: #364b98;
		}

		.change-badge {
		    position: absolute;
		    top: 10px;
		    right: 10px;
		    background-color: #ffc107;
		    color: #000;
		    border-radius: 50%;
		    padding: 5px 10px;
		    font-size: 16px;
		    font-weight: bold;
		    min-width: 25px;
		    height: 25px;
		    display: flex;
		    align-items: center;
		    justify-content: center;
		    border: 2px solid white;
		}

		#modalChangeStatus .modal-body,
		#selectedDetailList {
			overflow-x: hidden;
		}

		#selectedDetailList .row {
			margin-left: 0;
			margin-right: 0;
		}

		.change-selectable-row {
			cursor: pointer;
		}

		.change-selectable-row:hover > td {
			background-color: #f1f5ff !important;
		}

		.change-status-alert-stack {
			position: fixed;
			left: 50%;
			bottom: 28px;
			transform: translateX(-50%);
			z-index: 1080;
			min-width: 320px;
			max-width: calc(100vw - 32px);
			display: flex;
			flex-direction: column;
			gap: 10px;
			pointer-events: none;
		}

		.change-status-alert {
			width: 100%;
			margin: 0;
			box-shadow: 0 8px 20px rgba(0,0,0,0.18);
			pointer-events: auto;
			overflow: hidden;
			transition: opacity 0.3s ease, transform 0.3s ease, max-height 0.3s ease, padding 0.3s ease, margin 0.3s ease;
			animation: changeStatusAlertIn 0.25s ease;
			max-height: 120px;
		}

		.change-status-alert.is-hiding {
			opacity: 0;
			transform: translateY(14px) scale(0.98);
			max-height: 0;
			padding-top: 0;
			padding-bottom: 0;
			margin: 0;
		}

		@keyframes changeStatusAlertIn {
			from {
				opacity: 0;
				transform: translateY(14px) scale(0.98);
			}
			to {
				opacity: 1;
				transform: translateY(0) scale(1);
			}
		}
	</style>
	<body>
		<div id="app">
		    <div th:replace="common/menu :: menu"></div>
		    <div id="main">
		        <header th:replace="common/header :: header_nav"></header>
		        <div class="page-heading">
		            <h3>อัปเดทสถานะ</h3>
		        </div>
				<div class="page-content">
		            <div class="row">
						<div class="card">
		                	<div class="card-body">
								<div class="col-12">
									<div class="row g-1" th:utext="${osCheckList}">
									</div>
									<div class="row mt-3">
										<div class="col-md-4">
											<div class="input-group">
												<label for="artistFilter" class="input-group-text">ศิลปิน</label>
												<input type="text" id="artistFilter" class="form-control" placeholder="ค้นหาศิลปิน" oninput="search_artist()">
											</div>
										</div>
										<div class="col-md-4">
											<div class="input-group">
												<label for="websiteFilter" class="input-group-text">เว็บไซต์</label>
												<select id="websiteFilter" class="form-select" onchange="load_change_data()" th:utext="${websiteList}"></select>
											</div>
										</div>
									</div>
		                       </div>
		                    </div>
		                </div>
		            </div>
					<div class="row">
					    <div class="col-12">
							<div class="card">
					            <div class="card-body">
									<table class="table table-striped" id="table2">
									    <thead>
									        <tr>
									            <th class="auto_width">
													<input class="form-check-input" type="checkbox" id="checkAll" onchange="toggle_all_rows()">
												</th>
									            <th class="auto_width">ชื่อลูกค้า</th>
									            <th class="auto_width">ศิลปิน</th>
									            <th class="auto_width">ชื่อสินค้า</th>
									            <th class="auto_width">เว็บ</th>
									            <th class="auto_width">เวอชั่น</th>
									            <th class="auto_width">ปก</th>
									            <th class="status_width">จำนวน</th>
									            <th class="status_width">สถานะ</th>
									        </tr>
									    </thead>
										<tbody th:utext="${listOrderDeatil}"></tbody>
									</table>
					            </div>
					        </div>
					    </div>
					</div>
		        </div>
				<div th:include="./order/modal-checkout"></div>
				<div class="modal fade text-left" id="modalChangeStatus" tabindex="-1" role="dialog" aria-hidden="true">
				    <div class="modal-dialog modal-xl" role="document">
				        <div class="modal-content">
				            <div class="modal-header bg-primary">
				                <h4 class="modal-title white">อัปเดทสถานะ</h4>
				                <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
				                    <i data-feather="x"></i>
				                </button>
				            </div>
				            <div class="modal-body">
				                <div class="row">
				                    <div class="col-md-6">
				                        <div class="input-group mb-3">
				                            <span class="input-group-text" style="width: 120px;">สถานะเดิม</span>
				                            <input type="text" class="form-control" id="selectedStatusName" readonly>
				                        </div>
				                    </div>
				                    <div class="col-md-6">
				                        <div class="input-group mb-3">
				                            <span class="input-group-text" style="width: 120px;">สถานะใหม่</span>
				                            <select class="form-select" id="newOrderStatus" th:utext="${orderStatusList}"></select>
				                        </div>
				                    </div>
				                </div>
				                <div class="fw-bold mt-2 mb-3">รายการที่เลือก <span id="selectedDetailCount">0</span> รายการ</div>
				                <div id="selectedDetailList" class="mb-4" style="max-height: 360px; overflow-y: auto; overflow-x: hidden;"></div>
				                <div class="row pt-3 border-top" id="costInputGroup" style="display: none;">
				                    <div class="col-md-4">
				                        <div class="input-group mb-3">
				                            <span class="input-group-text" style="width: 120px;">ต้นทุน</span>
				                            <input type="text" class="form-control text-end" id="costPrice" placeholder="0" inputmode="decimal">
				                            <span class="input-group-text">บาท</span>
				                        </div>
				                    </div>
				                    <div class="col-12">
				                        <div class="input-group mb-3">
				                            <span class="input-group-text" style="width: 120px;">หมายเหตุ</span>
				                            <input type="text" class="form-control" id="costNote">
				                        </div>
				                    </div>
				                </div>
				                <div class="row pt-3 border-top" id="lotInputGroup" style="display: none;">
				                    <div class="col-md-6">
				                        <div class="input-group mb-3">
				                            <span class="input-group-text" style="width: 120px;">เลข Lot</span>
				                            <input type="text" class="form-control" id="l_lot_number" name="l_lot_number">
				                        </div>
				                    </div>
				                </div>
				                <div class="row pt-3 border-top" id="shippingInputGroup" style="display: none;">
				                    <div class="col-md-4">
				                        <div class="input-group mb-3">
				                            <span class="input-group-text" style="width: 120px;">ค่าส่ง</span>
				                            <input type="text" class="form-control text-end money-input" id="shippingPrice" placeholder="0" inputmode="decimal">
				                            <span class="input-group-text">บาท</span>
				                        </div>
				                    </div>
				                    <div class="col-12">
				                        <div class="input-group mb-3">
				                            <span class="input-group-text" style="width: 120px;">หมายเหตุ</span>
				                            <input type="text" class="form-control" id="shippingNote">
				                        </div>
				                    </div>
				                </div>
				            </div>
				            <div class="modal-footer">
				                <button type="button" class="btn btn-success" onclick="save_change_status()">บันทึก</button>
				                <button type="button" class="btn btn-danger" data-bs-dismiss="modal">ปิด</button>
				            </div>
				        </div>
				    </div>
				</div>
		        <footer th:replace="common/footer :: footer"></footer>
		    </div>
		</div>
		<button type="button" class="btn-change-floating" id="btnChangeSelected" onclick="open_change_status_modal()">
		    <i class="fas fa-check-circle"></i>
		    <span id="selected-count" class="change-badge">0</span>
		</button>
		<script th:src="@{/script/change.js}"></script>
	</body>
</html>
