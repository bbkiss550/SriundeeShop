<div class="modal fade text-left w-100" id="modalDraft" tabindex="-1" role="dialog" aria-labelledby="modalDraftLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-full" role="document">
        <div class="modal-content" style="height: 90vh; display: flex; flex-direction: column;">

            <!-- Header -->
            <div class="modal-header" style="background-color: #0d6efd;">
                <h4 class="modal-title white" id="modalDraftLabel">
                    <i class="bi bi-cart-check-fill me-2"></i>
                    ตารางทด — รายการที่เลือก
                    <span id="draftCountModal" class="badge bg-white text-primary ms-2">0</span>
                </h4>
                <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
                    <i data-feather="x"></i>
                </button>
            </div>

            <!-- Body: ตาราง (scrollable) -->
            <div class="modal-body" style="flex: 1 1 auto; overflow-y: auto; padding: 0;">
                <table class="table table-bordered table-hover mb-0" id="draftTable">
                    <thead class="table-primary sticky-top">
                        <tr>
                            <th>ชื่อลูกค้า</th>
                            <th>ชื่อสินค้า</th>
                            <th>เว็บ</th>
                            <th>เวอชั่น</th>
                            <th>ปก</th>
                            <th style="width:80px" class="text-center">จำนวน</th>
                            <th style="width:120px" class="text-center">สถานะ</th>
                            <th style="width:50px" class="text-center"></th>
                        </tr>
                    </thead>
                    <tbody id="draftTableBody">
                        <tr id="draftEmptyRow">
                            <td colspan="8" class="text-center text-muted py-4">
                                <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                                ยังไม่มีรายการที่เลือก
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Footer -->
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-danger me-auto" onclick="clearAll()">
                    <i class="bi bi-trash"></i> ล้างทั้งหมด
                </button>
                <button type="button" class="btn btn-success" onclick="saveDraft()">
                    <i class="bi bi-save"></i> บันทึก
                </button>
                <button type="button" class="btn btn-danger" data-bs-dismiss="modal">
                    <i class="bi bi-x-lg"></i> ปิด
                </button>
            </div>

        </div>
    </div>
</div>
